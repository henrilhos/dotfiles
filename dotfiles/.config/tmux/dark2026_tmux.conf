# vim:set ft=tmux:

# --> dark2026 (VS Code 2026 Dark)
#
# Drop-in flavor file for the catppuccin/tmux plugin (github.com/catppuccin/tmux).
# Mirrors the structure of catppuccin's own themes/catppuccin_mocha_tmux.conf,
# remapped to the composed VS Code 2026 Dark palette.
#
# Every value below comes from lua/vs2026/palette.lua in
# github.com/henrilhos/vs2026.nvim, which resolves the theme's full include
# chain (2026-dark -> dark_modern -> dark_plus -> dark_vs). The VS Code key
# each color comes from is noted inline.
#
# Note on the surfaces: catppuccin drives status-style from @thm_mantle and
# popup-style from @thm_bg, so mantle carries statusBar.background and bg
# carries the widget background. Mapping mantle to editor.background instead
# would make the bar the same shade as the pane it sits under.
#
# Uses `-g` (forced), not `-og`, so a plain reload always re-applies these
# values even if @thm_* was already set from a previous flavor in this
# tmux server. Source this file BEFORE `run '.../tpm/tpm'` so the plugin's
# own `-o` (only-if-unset) flavor defaults become no-ops afterward.

set -gq @thm_bg "#202122"   # editorWidget / menu / quickInput.background
set -gq @thm_fg "#bfbfbf"   # foreground

# Colors
set -gq @thm_rosewater "#d7ba7d"  # constant.character.escape
set -gq @thm_flamingo "#ffa198"   # markup.deleted
set -gq @thm_pink "#da70d6"       # editorBracketHighlight.foreground2
set -gq @thm_mauve "#c586c0"      # keyword.control (faithful)
set -gq @thm_red "#ff7b72"        # keyword
set -gq @thm_maroon "#d16969"     # regex character class (faithful)
set -gq @thm_peach "#ffa657"      # entity.name / variable
set -gq @thm_yellow "#dcdcaa"     # support.function (faithful)
set -gq @thm_green "#7ee787"      # entity.name.tag / markup.inserted
set -gq @thm_teal "#4ec9b0"       # entity.name.type / support.class
set -gq @thm_sky "#a5d6ff"        # string
set -gq @thm_sapphire "#79c0ff"   # constant / support
set -gq @thm_blue "#569cd6"       # constant.language (faithful)
set -gq @thm_lavender "#d2a8ff"   # entity.name.function

# Surfaces and overlays
set -gq @thm_subtext_1 "#969696"  # editorInlayHint.foreground
set -gq @thm_subtext_0 "#bbbebf"  # editor.foreground
set -gq @thm_overlay_2 "#8c8c8c"  # descriptionForeground
set -gq @thm_overlay_1 "#626363"  # editorGhostText.foreground
set -gq @thm_overlay_0 "#555555"  # disabledForeground
set -gq @thm_surface_2 "#414243"  # editorSuggestWidget.selectedBackground
set -gq @thm_surface_1 "#333536"  # input.border / dropdown.border
set -gq @thm_surface_0 "#2a2b2c"  # widget.border / menu.border / statusBar.border
set -gq @thm_mantle "#191a1b"     # statusBar.background
set -gq @thm_crust "#0c0c0d"      # editor.background dimmed
