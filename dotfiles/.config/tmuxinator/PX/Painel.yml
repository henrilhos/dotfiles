name: Painel
root: ~/Code/PX-Center/Painel

windows:
  - editor:
      panes:
        - editor:
            - tmux set-window-option main-pane-width 65% && tmux select-layout main-vertical
            - nvim .
        - claude:
            - claude
      layout: main-vertical
  - server:
      panes:
        - server:
            - export GITHUB_TOKEN=$(gh auth token) && mise x -- npm install && mise x -- npm run dev
        -  # empty pane
      layout: main-vertical
