name: Torre
root: ~/Code/PX-Center/Torre

windows:
  - editor:
      panes:
        - editor:
            - tmux set-window-option main-pane-width 65% && tmux select-layout main-vertical
            - nvim .
        - claude:
            - claude
      layout: main-vertical
  - server:
      panes:
        - server:
            - sail up -d && sail artisan migrate && lazydocker
        -  # empty pane
      layout: main-vertical
