# ~/.config/sesh/sesh.toml — managed by ~/dotfiles (configs/sesh/sesh.toml)
# Full reference: https://github.com/joshmedeski/sesh#configuration
#
# Named sessions here show up in `sesh connect`/the fzf popup (prefix + T,
# or `sc` outside tmux) alongside plain tmux/zoxide results. Add a
# [[wildcard]] block once there's an actual projects directory convention —
# no point guessing one now.

[[session]]
name = "dotfiles"
path = "~/dotfiles"
startup_command = "nvim"
