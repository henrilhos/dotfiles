# ~/.config/sesh/sesh.toml — managed by ~/dotfiles (configs/sesh/sesh.toml)
# Full reference: https://github.com/joshmedeski/sesh#configuration
#
# Named sessions here show up in `sesh connect`/the fzf popup (prefix + T,
# or `sc` outside tmux) alongside plain tmux/zoxide results.

[[session]]
name = "dotfiles"
path = "~/dotfiles"
startup_command = "nvim"

[[session]]
name = "cascao"
path = "~"
startup_command = "ssh -t cascao 'tmux new -A -s main'"
icon = "🍋"

# Personal projects.
[[wildcard]]
pattern = "~/Code/*"
icon = "🌱"

# Work projects, kept in a separate directory from personal ones.
[[wildcard]]
pattern = "~/Work/*"
icon = "💼"
