# Light half of the tmux-dark-notify toggle (configs/tmux/tmux.conf).
# Colors match Ghostty's built-in "Ayu Light" theme and
# configs/nvim/lua/plugins/colorscheme.lua's light scheme.

set -g @tmux-dotbar-bg "#F8F9FA"
set -g @tmux-dotbar-fg "#8A9199"
set -g @tmux-dotbar-fg-current "#5C6166"
set -g @tmux-dotbar-fg-session "#8A9199"
set -g @tmux-dotbar-fg-prefix "#FFAA33"

set -g pane-border-style "fg=#E7EAED"
set -g pane-active-border-style "fg=#FFAA33"
set -g message-style "bg=#FFAA33,fg=#F8F9FA"

# dotbar.tmux only computes status-style/window-status-current-format once,
# from whatever @tmux-dotbar-* values are set when it runs — re-run it here
# so a live OS light/dark switch actually repaints the status line.
run '~/.tmux/plugins/tmux-dotbar/dotbar.tmux'
