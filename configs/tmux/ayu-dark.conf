# Dark half of the tmux-dark-notify toggle (configs/tmux/tmux.conf).
# Colors match Ghostty's built-in "Ayu" theme and
# configs/nvim/lua/plugins/colorscheme.lua's dark scheme.

set -g @tmux-dotbar-bg "#0B0E14"
set -g @tmux-dotbar-fg "#565B66"
set -g @tmux-dotbar-fg-current "#BFBDB6"
set -g @tmux-dotbar-fg-session "#565B66"
set -g @tmux-dotbar-fg-prefix "#E6B450"

set -g pane-border-style "fg=#1B1F29"
set -g pane-active-border-style "fg=#E6B450"
set -g message-style "bg=#E6B450,fg=#0B0E14"

# dotbar.tmux only computes status-style/window-status-current-format once,
# from whatever @tmux-dotbar-* values are set when it runs — re-run it here
# so a live OS light/dark switch actually repaints the status line.
run '~/.tmux/plugins/tmux-dotbar/dotbar.tmux'
