# ~/.tmux.conf — managed by ~/dotfiles (configs/tmux/tmux.conf)

# Prefix: Ctrl-a instead of the default Ctrl-b.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Remove the delay after Esc — matters a lot in Neovim (LazyVim), where a
# long escape-time makes leaving insert mode feel laggy.
set -sg escape-time 0

set -g mouse on
set -g history-limit 10000

# Windows/panes start at 1, not 0 — easier to reach on the keyboard.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# True color, so colorschemes (Dracula PRO in Ghostty/Neovim) render right.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Pass through extended keys (e.g. Ctrl/Shift/Alt combos with non-ASCII
# keys) to apps inside tmux instead of tmux swallowing them — Neovim uses
# this to distinguish keys like Ctrl-i from Tab.
set -s extended-keys on

# Forward focus in/out events to apps inside tmux — Neovim uses this for
# `autoread`/`checktime` and to fire FocusGained/FocusLost autocmds.
set -g focus-events on

# Push the active window name and the running command of the active pane
# into the terminal's title, so Ghostty's tab/window title reflects what's
# focused in tmux (panes themselves have no name, only a current command).
set -g set-titles on
set -g set-titles-string "#W: #{pane_current_command}"

# Split panes with | and -, keeping the current pane's working directory.
bind '|' split-window -h -c "#{pane_current_path}"
bind '-' split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New windows open in the current pane's working directory.
bind c new-window -c "#{pane_current_path}"

# Vi-style copy mode.
setw -g mode-keys vi

# vim-tmux-navigator: Ctrl-h/j/k/l move between tmux panes and Neovim splits
# seamlessly, without the prefix — Neovim side lives in
# configs/nvim/lua/plugins/tmux-navigator.lua.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+/)?g?(view|l?n?vim?x?)(diff)?$'"
bind-key -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'

bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R

# Reload this file with prefix + r.
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"
