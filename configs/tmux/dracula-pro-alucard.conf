# Light half of the tmux-dark-notify toggle (configs/tmux/tmux.conf).
# Colors match submodules/dracula-pro-ghostty/alucard and
# configs/nvim/lua/plugins/colorscheme.lua's light scheme.

set -g status-style "bg=#F5F5F5,fg=#1F1F1F"
set -g window-status-current-style "bg=#644AC9,fg=#F5F5F5,bold"
set -g pane-border-style "fg=#B8B8B8"
set -g pane-active-border-style "fg=#644AC9"
set -g message-style "bg=#644AC9,fg=#F5F5F5"
