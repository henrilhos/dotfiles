# Gradle settings for every build on this machine.
#
# GRADLE_USER_HOME's gradle.properties takes precedence over a project's
# own, which is what makes this the right place for overrides that would
# otherwise be wiped — Expo projects regenerate android/ on prebuild.
#
# Do NOT put credentials here (signing keys, Maven repo tokens, NEXUS_*).
# This file is a symlink into the dotfiles repo, so anything added lands
# in git. Machine-local secrets belong in ~/.gradle/gradle.local.properties,
# which Gradle does not read automatically, or in the keychain.

# The React Native / Expo template ships -Xmx2048m, which is not enough to
# dex a mid-sized app: D8 dies with OutOfMemoryError and reports "Error
# while dexing" against whichever libraries happened to be in flight, which
# looks like library corruption rather than memory exhaustion.
#
# 4g assumes a 16 GB machine. Raise it on a bigger one; on 8 GB, drop to
# 3g and expect the emulator to compete for what's left.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
