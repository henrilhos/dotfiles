# ~/.config/starship.toml — managed by ~/dotfiles (configs/starship/starship.toml)
# Full option reference: https://starship.rs/config/
# Starting with defaults — customize modules here as you find what you want.

add_newline = false

[time]
disabled = true

[custom.bash]
command = "echo bash"
description = "Displays 'bash' if in bash shell"
when = '[ "$STARSHIP_SHELL" = "bash" ]'
format = '[$output](cyan bold) '
disabled = false
