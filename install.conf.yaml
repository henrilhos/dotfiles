- defaults:
    link:
      create: true
      relink: true
      backup: true

- create:
    - ~/Code
    - ~/Work

- link:
    ~/.bash_profile: configs/bash/bash_profile
    ~/.bashrc: configs/bash/bashrc
    ~/.claude/hooks: configs/claude/hooks
    ~/.claude/settings.json: configs/claude/settings.json
    ~/.claude/statusline.py: configs/claude/statusline.py
    ~/.colima/default/colima.yaml: configs/colima/default/colima.yaml
    ~/.config/bat/config: configs/bat/config
    ~/.config/bat/themes/Dracula.tmTheme: configs/bat/themes/Dracula.tmTheme
    ~/.config/btop/btop.conf: configs/btop/btop.conf
    ~/.config/ghostty/config: configs/ghostty/config
    ~/.config/ghostty/themes: submodules/dracula-pro-ghostty
    ~/.config/git/allowed_signers: configs/git/allowed_signers
    ~/.config/git/ignore: configs/git/gitignore
    ~/.config/karabiner/karabiner.json: configs/karabiner/karabiner.json
    ~/.config/mise/config.toml: configs/mise/config.toml
    ~/.config/nix-darwin: configs/nix-darwin
    ~/.config/nvim: configs/nvim
    ~/.config/sesh/sesh.toml: configs/sesh/sesh.toml
    ~/.config/starship.toml: configs/starship/starship.toml
    ~/.docker/config.json: configs/docker/config.json
    ~/.gitconfig: configs/git/gitconfig
    ~/.gradle/gradle.properties: configs/gradle/gradle.properties
    ~/.hushlogin: configs/shell/hushlogin
    ~/.oh-my-zsh: submodules/oh-my-zsh
    ~/.ssh/config: configs/ssh/config
    ~/.tmux.conf: configs/tmux/tmux.conf
    ~/.zshrc: configs/zsh/zshrc
    ~/Library/Application Support/lazygit/config.yml: configs/lazygit/config.yml
    ~/Work/.envrc: configs/direnv/work.envrc

- shell:
    - command: git submodule sync --recursive && git submodule update --init --recursive
      stdout: true
      stderr: true
    # Registers the Ayu themes in configs/bat/themes (delta reads bat's cache
    # too). bat comes from Homebrew, so like gh below this only works on the
    # second `--only shell` pass in bootstrap.sh.
    - command: command -v bat >/dev/null || exit 0; bat cache --build >/dev/null
      stdout: true
      stderr: true
    # gh comes from Homebrew via nix-darwin, which bootstrap.sh applies
    # after this file runs, so it re-runs `--only shell` once gh exists.
    - command: command -v gh >/dev/null || exit 0; gh extension list | grep -q github/gh-stack || gh extension install github/gh-stack
      stdout: true
      stderr: true
